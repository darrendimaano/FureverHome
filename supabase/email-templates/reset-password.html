<!doctype html>
<html lang="en">
  <body style="margin:0;background:#fffaf3;font-family:Arial,sans-serif;color:#35261f">
    <div style="max-width:560px;margin:0 auto;padding:40px 24px">
      <div style="font-size:24px;font-weight:700;color:#d9612b">FurEver Home</div>
      <div style="margin-top:24px;border:1px solid #eadfd5;border-radius:18px;background:#ffffff;padding:32px">
        <h1 style="margin:0 0 12px;font-size:28px;color:#5c3b2e">Reset your password</h1>
        <p style="font-size:16px;line-height:1.6;color:#746760">
          Use this recovery code to choose a new FurEver Home password:
        </p>
        <div style="margin:28px 0;border-radius:14px;background:#f8f1e7;padding:20px;text-align:center;font-size:34px;font-weight:800;letter-spacing:8px;color:#d9612b">
          {{ .Token }}
        </div>
        <p style="font-size:14px;line-height:1.6;color:#746760">
          Enter this code on the password reset page. If you did not request a password reset,
          you can safely ignore this email.
        </p>
      </div>
    </div>
  </body>
</html>
